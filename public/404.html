<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>عُرْوَة - جاري التوجيه</title>
    <script type="text/javascript">
      // SPA redirect for GitHub Pages / Static hosting
      var pathSegmentsToKeep = window.location.pathname.startsWith('/urwa-islamic-app') ? 1 : 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>جاري التوجيه إلى الصفحة الرئيسية...</p>
  </body>
</html>
